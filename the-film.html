<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unite Property Division - the film</title>
<style>
  :root { --navy:#14213d; --red:#e31e24; --ink:#eef2f8; --muted:#9fb0c9; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--navy); color:var(--ink); font-family: ui-sans-serif, system-ui,
         -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 40px 20px 72px; }
  .bar { height:6px; background:var(--red); border-radius:3px; width:96px; margin-bottom:24px; }
  h1 { font-size: clamp(22px,3vw,30px); margin:0 0 8px; letter-spacing:-0.01em; }
  p { color:var(--muted); font-size:14px; margin:0 0 20px; letter-spacing:.04em; text-transform:uppercase; }
  video { width:100%; border-radius:12px; background:#000; display:block;
          box-shadow:0 24px 60px rgba(0,0,0,.45); }
  a.dl { display:inline-flex; margin-top:18px; padding:12px 18px; border-radius:999px;
         background:var(--red); color:#fff; text-decoration:none; font-weight:700; font-size:14px; }
</style>
</head>
<body>
<main>
  <div class="bar"></div>
  <h1>Unite Property Division</h1>
  <p>59 seconds - the film as it appears on unite.elleis.uk</p>
  <video src="film-original.mp4?v=9" controls playsinline preload="metadata"></video>
  <a class="dl" href="film-original.mp4?v=9" download>Download the film</a>
</main>
</body>
</html>
